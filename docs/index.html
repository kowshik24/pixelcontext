<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelContext</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #111a2b;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #3b82f6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #12203d, var(--bg));
        color: var(--text);
      }
      .wrap {
        max-width: 840px;
        margin: 48px auto;
        padding: 0 20px;
      }
      .card {
        background: linear-gradient(180deg, #15243f, var(--panel));
        border: 1px solid #223457;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(2, 6, 23, 0.45);
      }
      h1 { margin: 0 0 10px; font-size: 2rem; }
      p { color: var(--muted); line-height: 1.6; }
      .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
      a.btn {
        text-decoration: none;
        color: white;
        background: var(--accent);
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 600;
      }
      a.btn.secondary { background: #1f314f; color: #cbd5e1; }
      code {
        padding: 2px 6px;
        border-radius: 6px;
        background: #0b1528;
        border: 1px solid #223457;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>PixelContext</h1>
        <p>
          Capture any UI element, annotate context, and export AI-ready Markdown prompts directly from your browser.
        </p>
        <p>
          Use <code>Ctrl/Cmd + Shift + X</code> to toggle capture mode after loading the extension.
        </p>
        <div class="actions">
          <a class="btn" href="https://github.com/kowshik24/pixelcontext">GitHub Repository</a>
          <a class="btn secondary" href="https://github.com/kowshik24/pixelcontext/releases">Releases</a>
        </div>
      </div>
    </div>
  </body>
</html>
